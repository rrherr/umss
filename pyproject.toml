[project]
name = "umss"
version = "0.2.0"
description = "Unsupervised music source separation with differentiable parametric source models: inference with the pretrained models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26", "scipy>=1.11"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["umss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
